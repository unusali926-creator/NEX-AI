name: Build Nex AI (Auto-Fix Wrapper)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Auto-Generate Missing Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "⚠️ gradlew file missing thi, automatic generate kar rahe hain..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Run Build
      run: |
        set +e
        ./gradlew assembleDebug --stacktrace > build_output.log 2>&1
        BUILD_STATUS=$?

        if [ $BUILD_STATUS -ne 0 ]; then
          echo "### ❌ Build Fail Hua! Asli Problem Neeche Hai:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E -C 2 "e: |FAILURE:|Unresolved reference|Compilation error|Could not find" build_output.log | head -n 40 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "--- [Aakhiri 25 Lines] ---" >> $GITHUB_STEP_SUMMARY
          tail -n 25 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "### 🎉 Mubarak ho! Build Success ho gaya! APK Ban Gaya!" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload APK on Success
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NexAI-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
