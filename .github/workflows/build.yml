name: Nex AI Deep Scanner & Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  scan-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Code Checkout
      uses: actions/checkout@v4

    - name: 2. Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: 4. Check & Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: 5. Deep Scan & Assemble Debug
      run: |
        set +e
        ./gradlew assembleDebug --stacktrace > full_build.log 2>&1
        STATUS=$?

        if [ $STATUS -eq 0 ]; then
          echo "## 🎉 BUILD SUCCESSFUL! APK TAYYAR HAI!" >> $GITHUB_STEP_SUMMARY
        else
          echo "## 🚨 NEX AI EXACT KOTLIN ERROR:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          
          # Har wo line jisme Kotlin file ka error hai (.kt:)
          grep -C 1 "\.kt:" full_build.log | head -n 40 >> $GITHUB_STEP_SUMMARY
          
          # Agar Unresolved reference hai toh wo bhi pakad lega
          grep -i "unresolved reference" full_build.log | head -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: 6. Upload APK on Success
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NexAI-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
